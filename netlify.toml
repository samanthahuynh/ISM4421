# Netlify configuration for the FAU Owl Weather app.
# Static site: no build step, Netlify serves the /public folder as-is.

[build]
  publish = "public"
  command = ""

# Security headers. connect-src allows the two Open-Meteo endpoints the app calls.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com"

# Cache static assets; always revalidate the HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Any unknown path falls back to the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
